[project]
name = "fraud-detection-workshop"
version = "0.1.0"
description = "DE in MNE 2025 retreat py-orchestration workshop"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.17.1",
    # Phase 2: Dramatiq + APScheduler
    "dramatiq[redis]>=1.15.0",
    "apscheduler>=3.10.4",
    "redis>=5.0.0",
    # Phase 3: Airflow is handled by docker
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]
